[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/alerts"
  to = "/.netlify/functions/alerts"
  status = 200
  force = true

[[redirects]]
  from = "/api/activity"
  to = "/.netlify/functions/activity"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
